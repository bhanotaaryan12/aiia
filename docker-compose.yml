version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiia-ctms-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiia_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiia_ctms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiia} -d ${POSTGRES_DB:-aiia_ctms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiia-ctms-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiia}:${POSTGRES_PASSWORD:-aiia_dev_password}@postgres:5432/${POSTGRES_DB:-aiia_ctms}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-aiia}:${POSTGRES_PASSWORD:-aiia_dev_password}@postgres:5432/${POSTGRES_DB:-aiia_ctms}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiia-ctms-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: AIIA Clinical Trials Dashboard
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
